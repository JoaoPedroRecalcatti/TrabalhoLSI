{% extends "base.html" %}
{% block titulo %}Entrar — Biblioteca UEMS{% endblock %}

{% block conteudo %}
<div class="caixa-login">
  <h1>Biblioteca UEMS</h1>
  <p class="sub">Sistema de Gestão de Biblioteca Universitária</p>

  <form method="post">
    <label>E-mail</label>
    <input type="email" name="email" value="{{ email }}" required autofocus>

    <label>Senha</label>
    <input type="password" name="senha" required>

    <button type="submit">Entrar</button>
  </form>

  <div class="dica">
    <strong>Contas para teste:</strong><br>
    Bibliotecário — <code>maria@uems.br</code> / <code>123</code><br>
    Aluno — <code>joao@uems.br</code> / <code>123</code>
  </div>
</div>
{% endblock %}
