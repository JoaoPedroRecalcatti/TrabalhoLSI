{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if livro else 'Novo' }} livro{% endblock %}

{% set v = form or livro %}

{% block conteudo %}
<h1>{{ 'Editar livro' if livro and livro.id else 'Novo livro' }}</h1>

<form class="formulario" method="post">
  <label>Título *</label>
  <input type="text" name="titulo" required
         value="{{ (v.titulo if v else '') or '' }}">

  <label>Autor</label>
  <input type="text" name="autor" value="{{ (v.autor if v else '') or '' }}">

  <label>Editora</label>
  <input type="text" name="editora" value="{{ (v.editora if v else '') or '' }}">

  <label>Categoria</label>
  <input type="text" name="categoria" list="sugestoes"
         value="{{ (v.categoria if v else '') or '' }}">
  <datalist id="sugestoes">
    <option value="Engenharia de Software">
    <option value="Banco de Dados">
    <option value="Programação">
    <option value="Redes">
    <option value="Matemática">
  </datalist>

  <label>Ano</label>
  <input type="text" name="ano" value="{{ (v.ano if v else '') or '' }}">

  <label>Quantidade de exemplares *</label>
  <input type="text" name="qtd_exemplares" required
         value="{{ (v.qtd_exemplares if v else 1) or 1 }}">

  <div class="botoes">
    <button type="submit">Salvar</button>
    <a class="cancelar" href="{{ url_for('livros') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
